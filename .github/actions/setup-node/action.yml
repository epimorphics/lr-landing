name: Setup Node Environment
description: Shared setup for Node.js scripts using Yarn

inputs:
  github-token:
    description: Token with read:packages, for @epimorphics packages from GitHub Packages
    required: true

runs:
  using: 'composite'
  steps:
    - name: Setup Node
      uses: actions/setup-node@v7
      with:
        node-version-file: '.nvmrc'
        cache: 'yarn'

    - name: Install Yarn
      run: |
        corepack enable
        corepack prepare yarn@stable --activate
        yarn --version
      shell: bash

    # User-level config, so the token is never written into the repo's .yarnrc.yml
    - name: Authenticate to GitHub Packages
      run: yarn config set --home npmScopes.epimorphics.npmAuthToken "$GITHUB_PACKAGES_TOKEN"
      env:
        GITHUB_PACKAGES_TOKEN: ${{ inputs.github-token }}
      shell: bash

    - name: Install dependencies
      run: yarn install --immutable
      shell: bash
