nodeLinker: pnpm

# @epimorphics packages come from GitHub Packages, which needs a token with
# read:packages even for public packages. The token is user-level config, never
# in this file: see "GitHub Packages token" in the README.
npmScopes:
  epimorphics:
    npmRegistryServer: "https://npm.pkg.github.com"

# Yarn holds back versions published in the last day (npmMinimalAgeGate), in
# case a third-party package is compromised. Only Epimorphics publishes to this
# scope, so its release candidates can be tested as soon as they are published.
npmPreapprovedPackages:
  - "@epimorphics/*"

yarnPath: .yarn/releases/yarn-4.18.1.cjs
